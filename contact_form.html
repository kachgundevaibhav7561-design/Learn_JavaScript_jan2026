<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
        <style>
            .vk{
                text-align: center;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            
            }
        </style>

</head>

<body>
    <main>
        <section>
            <form>
                <div class="container mt-5 ">
                    <div class="row">
                        <div class="col-md-3"></div>
                        <div class="col-md-6 border border-dark">
                            <h2 class="mb-4 vk">Contact us</h2>
                            <label for="exampleFormControlInput1" class="form-label ">Enter Name :</label><br>
                            <input type="text" class="form-control" id="exampleFormControlInput1"
                                placeholder="Enter Name" />
                            <label for="exampleFormControlInput1" class="form-label mt-2">Enter email :</label><br>
                            <input type="email" class="form-control" id="exampleFormControlInput1"
                                placeholder="Enter email " />
                            <label for="exampleFormControlInput1" class="form-label mt-2">Enter mobile no :</label><br>
                            <input type="number" class="form-control" id="exampleFormControlInput1"
                                placeholder="Enter phone number " />
                            <label for="exampleFormControlInput1" class="form-label mt-2">Enter Password:</label><br>
                            <input type="password" class="form-control" id="exampleFormControlInput1"
                                placeholder="Enter Password " />
                            <label for="exampleFormControlInput1" class="form-label mt-2">Enter conform Password:</label><br>
                            <input type="password" class="form-control" id="exampleFormControlInput1"
                                placeholder="conform Password" />
                            <label for="exampleFormControlInput1" class="form-label mt-2">Message:</label><br> 
                            <textarea rows="2" cols="50">Your Message :</textarea><br>

                            <label>Select gender :</label><br>
                            <input type="radio" name="gender">  Male 
                            <input type="radio" name="gender">  Female 
                            <input type="radio" name="gender">  Other 

                            <div class="row mt-3 mb-4">
                                <div class="col-md-12">
                                    <button class="vk">Submit</button>
                                    <button class="vk ">Reset</button>
                                </div>
                            </div>


                            
                           
                        </div>
                        <div class="col-md-3"></div>
                    </div>
                </div>
            </form>

        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
