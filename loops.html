<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>

<body>
    <script>
        // for loop example
        document.write("<ol>");
        for (var a = 1; a <= 10; a++) {
            document.write("<li>Hello its vaibhav</li>");

        }
        document.write("</ol>");

    </script>
    <script>
        // while loop 
        var x = 1;
        document.write("<ol>");
        while (x <= 10) {
            document.write("<li>Pune</li>");
            x++;
        }
        document.write("<ol>");
    </script>

    <script>
        // do while loop

        var b = 1;
        document.write("<ol>");
        do {
            document.write("<li>welcome to fct</li>");
            b++;
        }
        while (b <= 10)
        document.write("</ol>")
    </script>

</body>

</html>
